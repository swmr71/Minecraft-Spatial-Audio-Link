name: CI

# プラグインのビルドと Reposilite への公開は build-plugin.yml

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: src/msal-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/msal-node/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          MSAL_TEST_REDIS_URL: redis://127.0.0.1:6379/15
