name: CI

# プラグインのビルドと Reposilite への公開は build-plugin.yml

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults:
      run:
        working-directory: src/msal-node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/msal-node/package-lock.json
      - run: npm ci
      - run: npm test
        env:
          MSAL_TEST_REDIS_URL: redis://127.0.0.1:6379/15

  docker:
    # compose の定義が壊れていないか確認する（イメージのビルドは docker-image.yml）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose config
        working-directory: deploy
        env:
          LIVEKIT_NODE_IP: 127.0.0.1
          LIVEKIT_API_SECRET: ci-secret-0123456789abcdef0123456789abcdef
          REDIS_PASSWORD: ci-redis-0123456789abcdef
          SESSION_SECRET: ci-session-0123456789abcdef
          PLUGIN_API_KEY: ci-plugin-0123456789abcdef
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.build.yml config -q
