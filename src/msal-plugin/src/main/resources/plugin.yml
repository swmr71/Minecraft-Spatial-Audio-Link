name: MSALPlugin
version: '${project.version}'
main: com.clustersprj.msal.MSALPlugin
api-version: '1.20'
author: clusters-prj
description: Minecraft Spatial Audio Link - 座標収集とVC連携プラグイン

commands:
  vc:
    description: ボイスチャットへの接続・管理コマンド
    usage: /vc <join|broadcast>
  radio:
    description: 無線チャンネルを切り替える
    usage: /radio <channel>

permissions:
  msal.use:
    description: /vc join と /radio を使用できる
    default: true
  msal.broadcast:
    description: /vc broadcast を実行できる
    default: op
