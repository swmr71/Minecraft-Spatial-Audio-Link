redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  database: 0
  # 接続・応答のタイムアウト(ms)。トンネル越しなど遠い Redis なら長めに
  timeout-ms: 1000

backend:
  # msal-node のベースURL（例: http://10.2.1.5:8010）
  base-url: "http://127.0.0.1:8010"
  # プレイヤーに案内するログインURL（公開ホスト名）
  login-url: "https://vc.clusters-prj.com/login/"
  # msal-node の PLUGIN_API_KEY と同じ値（必須）
  api-key: ""

broadcast:
  # 座標送信間隔（tick、20 tick = 1秒）
  interval-ticks: 5
  # Redis 上のキーTTL（秒）
  ttl-seconds: 5

radio:
  # /radio で指定できる最大チャンネル番号
  max-channel: 999
