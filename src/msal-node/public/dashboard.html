<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VC Spatial Dashboard - clusters-prj</title>
    <!-- Livekit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.20.2/dist/livekit-client.umd.js"
            integrity="sha384-PNjIyZ+2FmX+dznaVE1dInNE8OTi3PfAsra3YTcvMLKXJZFzIVb5b8lkfB3igfsj"
            crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid #333;
        }
        h1 { color: #ffffff; margin-bottom: 0.5rem; }

        .radar-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 1.5rem auto;
            background: radial-gradient(circle, #1a2a1a 0%, #000 100%);
            border: 2px solid #00ff0033;
            border-radius: 50%;
            overflow: hidden;
        }
        #radar-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .audio-monitors {
            display: flex;
            justify-content: space-around;
            margin: 1rem 0;
            background: #111;
            padding: 10px;
            border-radius: 8px;
        }
        .gauge-wrapper { width: 45%; text-align: left; }
        .gauge-label { font-size: 0.7rem; color: #888; margin-bottom: 4px; }
        .gauge-bar-bg {
            width: 100%;
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
        }
        .gauge-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d2d3, #0984e3);
            transition: width 0.1s;
        }

        .user-badge {
            display: inline-block;
            background: #2d3436;
            padding: 5px 15px;
            border-radius: 20px;
            color: #00d2d3;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        #my-coords {
            font-family: monospace;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            color: #aaa;
        }
        .coord-val { color: #fff; font-weight: bold; }

        #status-indicator {
            margin-bottom: 1rem;
            padding: 8px;
            border-radius: 5px;
            background: #252525;
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        .btn-connect { background-color: #0984e3; color: white; }
        .btn-mute { background-color: #636e72; color: white; }
        .btn-mute.active { background-color: #d63031; }
        .btn-leave { background-color: #2d3436; color: #fab1a0; border: 1px solid #d6303122; }

        #active-controls { display: flex; gap: 10px; }
        .hidden { display: none !important; }
        #broadcast-banner { background: #3b2f00; border: 1px solid #feca57; color: #feca57; border-radius: 8px; padding: 8px 12px; margin: 8px 0; font-size: 0.9rem; }
        #vad-status { font-size: 0.8rem; color: #888; min-height: 1.2em; margin-bottom: 8px; }
        #active-controls { flex-wrap: wrap; }
        #admin-card { margin-top: 24px; padding-top: 16px; border-top: 1px solid #333; text-align: left; font-size: 0.9rem; }
        #admin-card h2 { font-size: 1.1rem; margin: 0 0 8px; }
        #admin-card h3 { font-size: 0.85rem; color: #aaa; margin: 14px 0 6px; }
        #admin-card input, #admin-card select { box-sizing: border-box; width: 100%; padding: 8px; background: #222; border: 1px solid #333; color: #fff; border-radius: 6px; }
        #admin-card .row { display: flex; gap: 8px; margin-top: 6px; }
        #admin-card .row .btn { padding: 8px 12px; font-size: 0.85rem; }
        #admin-card .note { color: #888; font-size: 0.8rem; margin-top: 4px; }
        #admin-card .audio-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin: 4px 0; }
        #admin-card .audio-row .btn { width: auto; padding: 4px 10px; font-size: 0.8rem; }
        #admin-card table { width: 100%; font-size: 0.8rem; border-collapse: collapse; }
        #admin-card th, #admin-card td { text-align: left; padding: 3px 6px; border-bottom: 1px solid #222; }
    </style>
</head>
<body data-uuid="{{uuid}}" data-livekit-url="{{livekit_ws_url}}" data-role="{{role}}">

<div class="card">
    <h1>Spatial VC</h1>
    <div class="user-badge">User: {{mc_name}}</div>

    <div id="my-coords">
        Coords:
        X: <span id="pos-x" class="coord-val">---</span>,
        Y: <span id="pos-y" class="coord-val">---</span>,
        Z: <span id="pos-z" class="coord-val">---</span>
    </div>

    <div class="radar-container">
        <canvas id="radar-canvas" width="300" height="300"></canvas>
    </div>

    <div class="audio-monitors">
        <div class="gauge-wrapper">
            <div class="gauge-label">LEFT</div>
            <div class="gauge-bar-bg"><div id="gauge-l" class="gauge-fill"></div></div>
        </div>
        <div class="gauge-wrapper">
            <div class="gauge-label">RIGHT</div>
            <div class="gauge-bar-bg"><div id="gauge-r" class="gauge-fill"></div></div>
        </div>
    </div>

    <div id="broadcast-banner" class="hidden"></div>
    <div id="status-indicator">状態: 準備完了</div>
    <div id="vad-status"></div>

    <div class="controls">
        <button id="connect-btn" class="btn btn-connect">ボイスチャットに接続</button>

        <div id="active-controls" class="hidden">
            <button id="mute-btn" class="btn btn-mute">マイクをミュート</button>
            <button id="recal-btn" class="btn btn-mute" title="3秒間静かにして環境ノイズを測り直します">VAD再調整</button>
            <button id="leave-btn" class="btn btn-leave">退出</button>
        </div>
    </div>

    <div id="audio-container" style="display:none;"></div>

    <div id="admin-card" class="hidden">
        <h2>管理パネル (Super Admin)</h2>

        <h3>全体放送</h3>
        <input id="admin-bc-msg" type="text" maxlength="200" placeholder="メッセージ（任意）">
        <div class="row">
            <button id="admin-bc-start" class="btn btn-leave">放送開始</button>
            <button id="admin-bc-stop" class="btn btn-mute">放送停止</button>
        </div>
        <div class="note">放送中: <span id="admin-broadcasts">なし</span>（あなたの声が全員に届きます）</div>

        <h3>ダッキング（放送中に他の音量が残る割合）</h3>
        <input id="admin-duck" type="range" min="0" max="100" step="1" value="30">
        <div class="note"><span id="admin-duck-val">30</span> %</div>

        <h3>ラジオチャンネル</h3>
        <div class="row">
            <input id="admin-channel" type="number" min="1" max="999" placeholder="ch">
            <button id="admin-mute" class="btn btn-mute">ミュート</button>
            <button id="admin-unmute" class="btn btn-mute">解除</button>
        </div>
        <div class="note">ミュート中: <span id="admin-muted">なし</span></div>

        <h3>傍受</h3>
        <div class="row">
            <select id="admin-eaves-mode">
                <option value="off">OFF</option>
                <option value="all">全チャンネル</option>
                <option value="channel">チャンネル指定</option>
            </select>
            <input id="admin-eaves-ch" class="hidden" type="number" min="1" max="999" placeholder="ch">
        </div>

        <h3>音源（動画の音など）</h3>
        <div id="admin-audio" class="note">なし</div>

        <h3>オンライン</h3>
        <table><thead><tr><th>名前</th><th>ワールド</th><th>ch</th></tr></thead><tbody id="admin-players"></tbody></table>
        <div id="admin-msg" class="note"></div>
    </div>

    <form method="POST" action="/logout/" style="margin-top:16px;">
        <button type="submit" class="btn" style="background:transparent;color:#888;font-size:12px;">ログアウト</button>
    </form>
</div>

<script src="/static/vad.js"></script>
<script src="/static/dashboard.js"></script>
<script src="/static/admin.js"></script>

</body>
</html>
