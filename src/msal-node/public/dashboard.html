<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VC Spatial Dashboard - clusters-prj</title>
    <!-- Livekit Client SDK -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.20.2/dist/livekit-client.umd.js"
            integrity="sha384-PNjIyZ+2FmX+dznaVE1dInNE8OTi3PfAsra3YTcvMLKXJZFzIVb5b8lkfB3igfsj"
            crossorigin="anonymous"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #1e1e1e;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
            border: 1px solid #333;
        }
        h1 { color: #ffffff; margin-bottom: 0.5rem; }

        .radar-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 1.5rem auto;
            background: radial-gradient(circle, #1a2a1a 0%, #000 100%);
            border: 2px solid #00ff0033;
            border-radius: 50%;
            overflow: hidden;
        }
        #radar-canvas {
            position: absolute;
            top: 0;
            left: 0;
        }

        .audio-monitors {
            display: flex;
            justify-content: space-around;
            margin: 1rem 0;
            background: #111;
            padding: 10px;
            border-radius: 8px;
        }
        .gauge-wrapper { width: 45%; text-align: left; }
        .gauge-label { font-size: 0.7rem; color: #888; margin-bottom: 4px; }
        .gauge-bar-bg {
            width: 100%;
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
        }
        .gauge-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00d2d3, #0984e3);
            transition: width 0.1s;
        }

        .user-badge {
            display: inline-block;
            background: #2d3436;
            padding: 5px 15px;
            border-radius: 20px;
            color: #00d2d3;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        #my-coords {
            font-family: monospace;
            font-size: 0.8rem;
            margin-bottom: 1rem;
            color: #aaa;
        }
        .coord-val { color: #fff; font-weight: bold; }

        #status-indicator {
            margin-bottom: 1rem;
            padding: 8px;
            border-radius: 5px;
            background: #252525;
            font-size: 0.8rem;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .btn {
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            transition: opacity 0.2s;
        }
        .btn:disabled { background-color: #555; cursor: not-allowed; }
        .btn-connect { background-color: #0984e3; color: white; }
        .btn-mute { background-color: #636e72; color: white; }
        .btn-mute.active { background-color: #d63031; }
        .btn-leave { background-color: #2d3436; color: #fab1a0; border: 1px solid #d6303122; }

        #active-controls { display: flex; gap: 10px; }
        .hidden { display: none !important; }
    </style>
</head>
<body data-uuid="{{uuid}}" data-livekit-url="{{livekit_ws_url}}">

<div class="card">
    <h1>Spatial VC</h1>
    <div class="user-badge">User: {{mc_name}}</div>

    <div id="my-coords">
        Coords:
        X: <span id="pos-x" class="coord-val">---</span>,
        Y: <span id="pos-y" class="coord-val">---</span>,
        Z: <span id="pos-z" class="coord-val">---</span>
    </div>

    <div class="radar-container">
        <canvas id="radar-canvas" width="300" height="300"></canvas>
    </div>

    <div class="audio-monitors">
        <div class="gauge-wrapper">
            <div class="gauge-label">LEFT</div>
            <div class="gauge-bar-bg"><div id="gauge-l" class="gauge-fill"></div></div>
        </div>
        <div class="gauge-wrapper">
            <div class="gauge-label">RIGHT</div>
            <div class="gauge-bar-bg"><div id="gauge-r" class="gauge-fill"></div></div>
        </div>
    </div>

    <div id="status-indicator">状態: 準備完了</div>

    <div class="controls">
        <button id="connect-btn" class="btn btn-connect">ボイスチャットに接続</button>

        <div id="active-controls" class="hidden">
            <button id="mute-btn" class="btn btn-mute">マイクをミュート</button>
            <button id="leave-btn" class="btn btn-leave">退出</button>
        </div>
    </div>

    <div id="audio-container" style="display:none;"></div>

    <form method="POST" action="/logout/" style="margin-top:16px;">
        <button type="submit" class="btn" style="background:transparent;color:#888;font-size:12px;">ログアウト</button>
    </form>
</div>

<script src="/static/dashboard.js"></script>

</body>
</html>
